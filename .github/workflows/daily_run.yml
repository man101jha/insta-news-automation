name: Daily Finance Carousel Automation

on:
  schedule:
    # Run daily at 3:00 AM UTC (8:30 AM IST - morning update before market opens)
    - cron: '0 3 * * *'
  workflow_dispatch:
    # Allows manual triggering from the GitHub Actions tab

jobs:
  run-pipeline:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python 3.11
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
        cache: 'pip' # cache pip dependencies for faster builds

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        # Navigate to the project folder and install dependencies
        pip install -r finance_agent/requirements.txt

    - name: Install Playwright Browsers
      run: |
        # Playwright requires installing browser binaries for rendering screenshots
        playwright install chromium

    - name: Run Orchestrator Pipeline
      # Execute the main orchestrator script with environment variables populated from GitHub Secrets
      run: |
        cd finance_agent
        python main.py
      env:
        # LLM Secrets
        GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        
        # Reddit Secrets
        REDDIT_CLIENT_ID: ${{ secrets.REDDIT_CLIENT_ID }}
        REDDIT_CLIENT_SECRET: ${{ secrets.REDDIT_CLIENT_SECRET }}
        REDDIT_USER_AGENT: ${{ secrets.REDDIT_USER_AGENT }}
        
        # Canva Secrets
        CANVA_ACCESS_TOKEN: ${{ secrets.CANVA_ACCESS_TOKEN }}
        CANVA_BRAND_TEMPLATE_ID: ${{ secrets.CANVA_BRAND_TEMPLATE_ID }}
        
        # Telegram Secrets
        TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        
        # Instagram Secrets
        INSTAGRAM_BUSINESS_ACCOUNT_ID: ${{ secrets.INSTAGRAM_BUSINESS_ACCOUNT_ID }}
        INSTAGRAM_ACCESS_TOKEN: ${{ secrets.INSTAGRAM_ACCESS_TOKEN }}
